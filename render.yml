services:
  # ── Rails 8 Backend API (FREE TIER) ────────────────────
  - type: web
    name: localhelp-backend
    runtime: ruby
    rootDir: backend
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec rails db:prepare && bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: PORT
        value: "10000"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: localhelp-db
          property: connectionString
      # Google OAuth Authentication
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOW_DEV_GOOGLE_AUTH
        value: "false"

  # ── Next.js Web Frontend (FREE TIER) ───────────────────
  - type: web
    name: localhelp-web
    runtime: node
    rootDir: web
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: BACKEND_URL
        fromService:
          type: web
          name: localhelp-backend
          property: host
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

# ── PostgreSQL Database (FREE TIER) ─────────────────────
databases:
  - name: localhelp-db
    databaseName: localhelp_production
    user: localhelp
    plan: free
